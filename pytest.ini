[pytest]
# Active tests cover the post-Slice-0 evidence explorer. The retired
# finding/RCA detector tests are preserved under legacy_tests/ but are not a
# release gate because their production interfaces were intentionally
# tombstoned during the evidence-only pivot.
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --tb=short

markers =
    slow: tests slower than 5 seconds
    integration: end-to-end tests touching the full pipeline
